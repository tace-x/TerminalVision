[package]
name = "TerminalVision"
version = "0.1.0"
edition = "2024"
description = "A lightweight native terminal file manager written in Rust."
license = "MIT"
readme = "README.md"

[lib]
name = "terminalvision"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
libc = "0.2"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[dev-dependencies]
tempfile = "3.27.0"
